name: JobShield CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Test the real trained model and API
        run: python -m pytest -q
      - name: Build Docker image
        run: docker build -t jobshield:ci .
      - name: Start Docker container
        run: docker run -d --name jobshield-ci -p 127.0.0.1:8000:8000 jobshield:ci
      - name: Verify container health and prediction
        run: python scripts/smoke_test.py
      - name: Container logs
        if: always()
        run: docker logs jobshield-ci || true
      - name: Stop container
        if: always()
        run: docker rm -f jobshield-ci || true
